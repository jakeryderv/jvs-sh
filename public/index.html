<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Jake Van Slyke" />
    <title>jvs.sh</title>
    <style>
      :root {
        /* carbonfox — https://github.com/EdenEast/nightfox.nvim */
        --bg1: #161616;
        --fg1: #f2f4f8;
        --fg3: #8d8f91;
        --green: #25be6a;
      }
      html {
        background: var(--bg1);
        color: var(--fg1);
        font: 1rem/1.6 ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      }
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
        box-sizing: border-box;
      }
      main {
        max-width: 40ch;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 600;
      }
      h1::before {
        content: "> ";
        color: var(--green);
      }
      p {
        margin: 0;
        color: var(--fg3);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jake Van Slyke</h1>
      <p>Site under construction.</p>
    </main>
  </body>
</html>
